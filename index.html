<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oxford 3000">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eeeef4">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Oxford 3000</title>
<style>
:root{
  --bg:#eeeef4;--card:#ffffff;--ink:#4a4a5c;--mute:#a9a9bd;--line:#ececf3;--soft:#f6f6fa;
  --accent:#6c7fe6;--green:#5fc788;--red:#e0605a;--pink:#e0809f;--orange:#ffd38a;--gray:#c5c5c9;--sheet:#ffffff;--shade:rgba(40,40,70,.35);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#14141b;--card:#1f1f2a;--ink:#e8e8f2;--mute:#7b7b92;--line:#2c2c3a;--soft:#2a2a37;--accent:#8c9cff;--sheet:#242432;--shade:rgba(0,0,0,.55);--gray:#6b6b78}
}
:root[data-theme="dark"]{--bg:#14141b;--card:#1f1f2a;--ink:#e8e8f2;--mute:#7b7b92;--line:#2c2c3a;--soft:#2a2a37;--accent:#8c9cff;--sheet:#242432;--shade:rgba(0,0,0,.55);--gray:#6b6b78}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.page{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 14px 8px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;display:block;padding-bottom:20px}
.bar{display:flex;align-items:center;justify-content:center;height:44px}
.bar h1{margin:0;font-size:17px;font-weight:500;text-align:center}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.iconbtn svg{width:26px;height:26px}
.iconbtn:disabled{color:var(--mute);opacity:.6}
.statrow{display:flex;align-items:center;justify-content:space-between;min-height:34px;padding-left:8px}
.statrow span{font-size:14px;color:var(--mute)}
.dashes{display:flex;gap:5px;padding:2px 8px 0}
.dashes i{flex:1;height:4px;border-radius:2px;background:rgba(130,130,170,.28)}
.dashes i.on{background:var(--accent)}
.dashes.full i.on{background:var(--green)}
#stage{flex:1;position:relative;min-height:0;margin-top:12px}
#card,#done{position:absolute;inset:0;background:var(--card);border-radius:24px;display:flex;flex-direction:column;overflow:hidden}
#card{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transform-origin:50% 85%;will-change:transform}
.ctop{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0 22px}
.tag{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:500}
.tag i{width:22px;height:22px;border-radius:6px;background:var(--soft);display:block}
.tag i.on{background:var(--accent)}
.dots{width:36px;height:36px;border:2px solid var(--accent);border-radius:50%;color:var(--accent);display:flex;align-items:center;justify-content:center}
.dots svg{width:18px;height:18px}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 12px 22px}
.chead .hl{min-width:0;flex:1}
.cat{font-size:14px;color:var(--mute);margin-bottom:2px}
.word{font-size:34px;line-height:1.12;font-weight:500;letter-spacing:-.4px;overflow-wrap:anywhere}
.word.sm{font-size:27px;line-height:1.22;letter-spacing:-.2px}
.ipa{font-size:18px;color:var(--ink);opacity:.85;margin-top:6px;overflow-wrap:anywhere}
.play{flex:none;width:58px;height:58px;border:2px solid var(--accent);border-radius:16px;color:var(--accent);display:flex;align-items:center;justify-content:center;margin-top:4px}
.play svg{width:21px;height:21px}
.play.on{background:var(--accent);color:var(--card)}
.cbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#front{display:flex;justify-content:center;padding-top:44px}
.show{height:64px;padding:0 26px;border-radius:18px;background:var(--soft);color:var(--ink);font-size:17px;font-weight:500;display:flex;align-items:center;gap:12px}
.show svg{width:26px;height:26px;color:var(--mute)}
#back{border-top:1px solid var(--line);position:relative;margin:0 0 0 22px}
#back:before{content:"";position:absolute;top:-9px;left:calc(50% - 22px);width:16px;height:16px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.ru{font-size:28px;line-height:1.2;font-weight:500;padding:26px 18px 22px 0}
.arow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:22px 18px 18px 0}
.aw{font-size:32px;line-height:1.12;font-weight:500;letter-spacing:-.3px;overflow-wrap:anywhere}
.aw.sm{font-size:25px;line-height:1.22}
.ex{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:13px 0;font-size:17px;line-height:1.3}
.ex:last-child{border-bottom:1px solid var(--line)}
.ex .chev{flex:none;width:16px}
.ex .t{flex:1}
.ex .t b{font-weight:700}
.ex .tr{display:block;color:var(--mute);font-size:14px;margin-top:4px}
.ex .xp{flex:none;width:44px;height:44px;color:var(--accent);display:flex;align-items:center;justify-content:center}
.ex .xp svg{width:18px;height:18px}
.zones{display:grid;grid-template-columns:1fr 14px 1fr;gap:6px;align-items:center;padding:10px 12px 14px}
.zone{height:68px;border-radius:15px;font-size:16px;font-weight:500;line-height:1.25;text-align:center;transition:background .12s,color .12s}
.sep{height:34px;display:flex;gap:2px;justify-content:center}
.sep i{width:1px;background:var(--line)}
#done{align-items:center;justify-content:center;text-align:center;padding:28px}
#done h2{font-size:26px;margin:0 0 10px;font-weight:600}
#done p{margin:0 0 22px;font-size:17px;line-height:1.4;color:var(--mute)}
.big{display:block;width:100%;max-width:320px;height:54px;border-radius:15px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;margin:0 auto 10px}
.big.alt{background:var(--soft);color:var(--ink);font-weight:500}
/* tabs */
#tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 0 4px;flex:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--mute);padding:4px 0}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}
/* cards (stats/menu) */
.panelc{background:var(--card);border-radius:20px;padding:16px;margin-top:12px}
.panelc h3{margin:0 0 10px;font-size:18px;font-weight:600}
.week{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px;position:relative}
.wd{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative;z-index:1;background:var(--soft);color:var(--mute)}
.wd.s{background:#c3caf8;color:#fff}
.wd.g{background:#aab4f5;color:#fff}
.wd.t{background:var(--card);border:2px solid var(--line);color:var(--ink)}
.wd.t:after{content:"";position:absolute;bottom:-12px;left:50%;margin-left:-7px;border:7px solid transparent;border-bottom-color:var(--accent);border-top:0}
.wline{position:absolute;left:24px;right:24px;top:25px;height:2px;background:var(--line);z-index:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--soft);border-radius:14px;padding:12px 12px}
.mini .a{font-size:15px;font-weight:500}
.mini .b{margin-top:6px;font-size:14px;color:var(--mute)}
.mini .b b{font-size:20px;color:var(--ink)}
.ring{display:flex;align-items:center;gap:16px;padding:14px 4px 4px}
.ring > svg{width:76px;height:76px;flex:none}
.ring .ed svg{width:22px;height:22px}
.ring .t1{font-size:19px;font-weight:500}
.ring .t2{font-size:44px;font-weight:500;line-height:1.05}
.ring .t2 small{font-size:30px;color:var(--mute)}
.ring .ed{color:var(--accent);width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg4 button{height:38px;border-radius:10px;font-size:15px}
.seg4 button.on{background:var(--card);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chartbox{margin-top:12px}
.chartbox svg{display:block;width:100%;height:auto}
.legend{margin-top:10px}
.lrow{display:grid;grid-template-columns:60px 60px 26px 1fr;gap:8px;align-items:center;padding:7px 0;font-size:17px}
.lrow .n{text-align:right}
.lrow i{width:26px;height:26px;border-radius:7px;display:block}
.lrow.h{font-size:15px;color:var(--ink);font-weight:500}
.note{font-size:14px;color:var(--mute);line-height:1.4;margin:6px 0}
.cur{font-size:16px;font-weight:500;margin:10px 0 4px}
.trow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.trow:last-child{border-bottom:0}
.pbar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:var(--green);border-radius:5px}
/* menu */
.mrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:16px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button,.btn{height:46px;border-radius:12px;background:var(--soft);font-weight:500;font-size:15px}
.seg button.on{background:var(--accent);color:#fff}
.btn{width:100%;margin-top:8px}
.btn.pri{background:var(--accent);color:#fff}
.btn.dng{color:var(--red)}
.step{display:flex;align-items:center;gap:14px}
.step button{width:40px;height:40px;border-radius:12px;background:var(--soft);font-size:22px;line-height:1}
.step b{min-width:28px;text-align:center;font-size:18px}
.vrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow:last-of-type{border-bottom:0}
.vrow .vn{flex:1;min-width:0}
.vrow .vn b{display:block;font-size:16px;font-weight:500}
.vrow .vn span{font-size:13px;color:var(--mute)}
.vrow .vp{width:42px;height:42px;border-radius:12px;border:2px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.vrow .vp svg{width:16px;height:16px}
.vrow .vs{height:42px;min-width:86px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:500;padding:0 10px}
.vrow .vs.on{background:var(--accent);color:#fff}
select{width:100%;height:44px;border-radius:12px;background:var(--soft);padding:0 10px;font-size:15px;margin-top:8px;-webkit-appearance:none;appearance:none}
textarea{width:100%;height:150px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:10px;font:13px/1.35 ui-monospace,Menlo,monospace;resize:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(30,30,45,.92);color:#fff;padding:11px 16px;border-radius:12px;font-size:15px;max-width:86vw;text-align:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#warn{background:#fff3cd;color:#6b5400;font-size:13px;text-align:center;padding:6px 10px;border-radius:10px;margin:0 14px 6px}
#veil{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--sheet);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.panel.mid{border-radius:24px;margin:auto 14px;align-self:center;max-height:80%}
.panel h3{margin:0 0 4px;font-size:20px;font-weight:600}
.panel .sub{font-size:14px;color:var(--mute);margin:0 0 14px;line-height:1.35}
.panel h4{margin:16px 0 8px;font-size:15px;font-weight:600;color:var(--mute)}
</style>
</head>
<body>
<div id="app">
  <section class="page" id="pgLearn">
    <div class="bar"><h1 id="title">Oxford 3000</h1></div>
    <div id="warn" hidden>Браузер не даёт сохранять прогресс. Не закрывай страницу и сделай копию: «Меню → Резервная копия».</div>
    <div class="statrow"><span id="stats"></span>
      <button class="iconbtn" id="btnUndo" aria-label="Отменить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    </div>
    <div class="dashes" id="dashes"></div>
    <div id="stage">
      <div id="card" hidden>
        <div class="ctop">
          <div class="tag"><i id="chk"></i><span id="tagTxt"></span></div>
          <button class="dots" id="btnDots" aria-label="Ещё"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
        </div>
        <div class="chead">
          <div class="hl"><div class="cat" id="cat"></div><div class="word" id="word"></div><div class="ipa" id="ipa"></div></div>
          <button class="play" id="btnPlay" aria-label="Произнести"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M7 4.5v15l12-7.5z"/></svg></button>
        </div>
        <div class="cbody" id="cbody">
          <div id="front"><button class="show" id="btnShow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C6.5 5 2.7 9 1.5 12c1.2 3 5 7 10.5 7s9.300-4 10.500-7C21.300 9 17.500 5 12 5zm0 11.500a4.500 4.500 0 110-9 4.500 4.500 0 010 9zm0-7a2.500 2.500 0 100 5 2.500 2.500 0 000-5z"/></svg><span>Показать ответ</span></button></div>
          <div id="back" hidden></div>
        </div>
        <div class="zones">
          <button class="zone" id="zKnow"></button>
          <div class="sep"><i></i><i></i><i></i></div>
          <button class="zone" id="zLearn"></button>
        </div>
      </div>
      <div id="done" hidden></div>
    </div>
  </section>

  <section class="page scroll" id="pgStats" hidden></section>
  <section class="page scroll" id="pgMenu" hidden></section>

  <nav id="tabs">
    <button class="tab on" data-tab="learn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h9a3 3 0 013 3v10a3 3 0 01-3 3H8a3 3 0 01-3-3V6a3 3 0 013-3zm-4 4.500V17a4 4 0 004 4h8.500" opacity=".9"/></svg><span>Учить</span></button>
    <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="12" width="4" height="8" rx="1.500"/><rect x="10" y="5" width="4" height="15" rx="1.500"/><rect x="16" y="9" width="4" height="11" rx="1.500"/></svg><span>Прогресс</span></button>
    <button class="tab" data-tab="menu"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.400 13a7.500 7.500 0 000-2l2-1.600-2-3.400-2.400 1a7.500 7.500 0 00-1.700-1L15 3.500h-4l-.4 2.500a7.500 7.500 0 00-1.700 1l-2.400-1-2 3.400 2 1.600a7.500 7.500 0 000 2l-2 1.600 2 3.400 2.400-1a7.500 7.500 0 001.700 1l.4 2.500h4l.4-2.500a7.500 7.500 0 001.700-1l2.400 1 2-3.400zM13 15.500a3.500 3.500 0 110-7 3.500 3.500 0 010 7z"/></svg><span>Меню</span></button>
  </nav>
</div>
<div id="toast"></div>

"Презентация и совещание"},{"en":"Let's get started.","ru":"Давайте начнём.","ipa":"lets ˈɡet ˈstɑːtɪd","cat":"Презентация и совещание"},{"en":"Today I'll talk about our results.","ru":"Сегодня я расскажу о наших результатах.","ipa":"təˈdeɪ aɪl ˈtɔːk əˈbaʊt aʊə rɪˈzʌlts","cat":"Презентация и совещание"},{"en":"First, let me give you a quick overview.","ru":"Сначала дам краткий обзор.","ipa":"ˈfɜːst | let mi ˈɡɪv ju ə ˈkwɪk ˈəʊvəvjuː","cat":"Презентация и совещание"},{"en":"Let's move on to the next slide.","ru":"Перейдём к следующему слайду.","ipa":"lets ˈmuːv ˈɒn tə ðə ˈnekst ˈslaɪd","cat":"Презентация и совещание"},{"en":"As you can see here...","ru":"Как вы видите здесь...","ipa":"əz ju kən ˈsiː ˈhɪə","cat":"Презентация и совещание"},{"en":"Let me explain this part.","ru":"Позвольте объяснить эту часть.","ipa":"let mi ɪkˈspleɪn ðɪs ˈpɑːt","cat":"Презентация и совещание"},{"en":"Here's the main point.","ru":"Вот главная мысль.","ipa":"ˈhɪəz ðə ˈmeɪn ˈpɔɪnt","cat":"Презентация и совещание"},{"en":"Take a look at this chart.","ru":"Взгляните на эту диаграмму.","ipa":"ˈteɪk ə ˈlʊk ət ðɪs ˈtʃɑːt","cat":"Презентация и совещание"},{"en":"Let me give you an example.","ru":"Приведу пример.","ipa":"let mi ˈɡɪv ju ən ɪɡˈzɑːmpl","cat":"Презентация и совещание"},{"en":"Moving on...","ru":"Идём дальше...","ipa":"ˈmuːvɪŋ ˈɒn","cat":"Презентация и совещание"},{"en":"In short, sales are up.","ru":"Короче говоря, продажи выросли.","ipa":"ɪn ˈʃɔːt | ˈseɪlz ər ˈʌp","cat":"Презентация и совещание"},{"en":"To sum up...","ru":"Подводя итог...","ipa":"tə ˈsʌm ˈʌp","cat":"Презентация и совещание"},{"en":"So, that's the plan.","ru":"Итак, вот такой план.","ipa":"ˈsəʊ | ðæts ðə ˈplæn","cat":"Презентация и совещание"},{"en":"What do you think?","ru":"Что вы думаете?","ipa":"ˈwɒt də ju ˈθɪŋk","cat":"Презентация и совещание"},{"en":"Any questions?","ru":"Есть вопросы?","ipa":"ˈeni ˈkwestʃənz","cat":"Презентация и совещание"},{"en":"That's a good question.","ru":"Хороший вопрос.","ipa":"ðæts ə ˈɡʊd ˈkwestʃən","cat":"Презентация и совещание"},{"en":"Let me check and get back to you.","ru":"Я уточню и вернусь к вам.","ipa":"let mi ˈtʃek ən ˈɡet ˈbæk tə ju","cat":"Презентация и совещание"},{"en":"Thank you for your attention.","ru":"Спасибо за внимание.","ipa":"ˈθæŋk ju fə jər əˈtenʃn","cat":"Презентация и совещание"}]</script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var KEY='o3_state_v2',OLDKEY='o3a1_state_v1',WKEY='o3_words_v2';
var mem={},storageOK=true;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){storageOK=false;return mem[k]||null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){storageOK=false;mem[k]=v}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){storageOK=false;delete mem[k]}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
var PHBASE=10000;

/* ---------- data ---------- */
var EMBED_W=JSON.parse(document.getElementById('words-data').textContent);
var EMBED_P=JSON.parse(document.getElementById('phrases-data').textContent);
var W=[],P=[],byId={},S=null;
function loadData(){
  var arr=null;
  try{var raw=lsGet(WKEY);if(raw)arr=JSON.parse(raw)}catch(e){}
  if(!Array.isArray(arr)||!arr.length)arr=EMBED_W;
  W=[];P=[];byId={};
  arr.forEach(function(x,i){
    if(!x||!x.w||!x.ru)return;
    var o={t:'w',id:x.id||i+1,w:String(x.w),sense:x.sense||'',ipa:x.ipa||'',ru:String(x.ru),pos:x.pos||'',lvl:x.lvl||'',ex:Array.isArray(x.ex)?x.ex:[],o:x.o||0};
    W.push(o);byId[o.id]=o;
  });
  EMBED_P.forEach(function(x,i){
    var o={t:'e',id:PHBASE+i+1,en:x.en,ru:x.ru,ipa:x.ipa||'',cat:x.cat||''};
    P.push(o);byId[o.id]=o;
  });
}
function defaults(){return {v:2,status:{},known:{},srs:{},mastered:{},hist:{},day:null,queue:[],selected:[],mode:'new',rq:[],goal:7,dailyCount:25,phrasesPerDay:5,goalShown:false,voice:null,lastStudy:null,total:0,undo:[]}}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(k,n){var p=k.split('-');return dayKey(new Date(+p[0],+p[1]-1,+p[2]+n))}
function save(){lsSet(KEY,JSON.stringify(S))}
function sanitize(){
  ['status','known','srs','mastered','hist'].forEach(function(k){if(!S[k]||typeof S[k]!=='object'||Array.isArray(S[k]))S[k]={}});
  S.dailyCount=Math.max(20,Math.min(35,parseInt(S.dailyCount,10)||25));
  S.phrasesPerDay=Math.max(0,Math.min(20,isNaN(parseInt(S.phrasesPerDay,10))?5:parseInt(S.phrasesPerDay,10)));
  S.goal=Math.max(7,Math.min(50,parseInt(S.goal,10)||7));
  ['queue','selected','rq','undo'].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});
  S.queue=S.queue.filter(function(id){return byId[id]});
  S.rq=S.rq.filter(function(id){return byId[id]});
  S.total=S.total||0;
}
function loadState(){
  var s=null;try{s=JSON.parse(lsGet(KEY)||'null')}catch(e){}
  if(!s){
    var old=null;try{old=JSON.parse(lsGet(OLDKEY)||'null')}catch(e){}
    if(old&&old.status){
      var map={};W.forEach(function(w){if(w.o)map[w.o]=w.id});
      s=defaults();
      Object.keys(old.status).forEach(function(k){if(map[k])s.status[map[k]]=old.status[k]});
      Object.keys(old.srs||{}).forEach(function(k){if(map[k])s.srs[map[k]]=old.srs[k]});
      s.dailyCount=old.dailyCount||25;
    }
  }
  S=Object.assign(defaults(),s||{});sanitize();
}

/* ---------- history ---------- */
function rec(k){
  k=k||dayKey();
  if(!S.hist[k])S.hist[k]={n:[],k:[],r:[],m:[],s:[],pl:[],pr:[],ps:[],c:0,g:S.goal};
  return S.hist[k];
}
function add(a,id){if(a.indexOf(id)<0)a.push(id)}
function todayN(){var r=S.hist[dayKey()];return r?r.n.length:0}

/* ---------- selection / srs ---------- */
var INTV=[1,3,7,14,30,60];
function setSrs(id,st){st=Math.max(0,Math.min(INTV.length-1,st));S.srs[id]={st:st,due:addDays(dayKey(),INTV[st])}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pickFrom(list,n,exclude){
  var ex={};(exclude||[]).forEach(function(i){ex[i]=1});
  var learning=[],fresh=[];
  list.forEach(function(w){if(ex[w.id])return;var st=S.status[w.id];if(st==='l')return;(st==='p'?learning:fresh).push(w.id)});
  learning=shuffle(learning);fresh=shuffle(fresh);
  var take=learning.slice(0,Math.floor(n/3));
  var rest=learning.slice(take.length);
  var out=take.concat(fresh.slice(0,n-take.length));
  if(out.length<n)out=out.concat(rest.slice(0,n-out.length));
  return shuffle(out);
}
function dueList(list){
  var t=dayKey();
  return list.filter(function(w){return S.status[w.id]==='l'&&S.srs[w.id]&&S.srs[w.id].due<=t})
    .sort(function(a,b){return S.srs[a.id].due<S.srs[b.id].due?-1:1}).map(function(w){return w.id});
}
function migrateSrs(){W.concat(P).forEach(function(w){if(S.status[w.id]==='l'&&!S.srs[w.id])setSrs(w.id,S.known[w.id]?1:0)})}
function buildQueue(){
  migrateSrs();
  var dw=dueList(W).slice(0,Math.floor(S.dailyCount*0.3));
  var nw=pickFrom(W,S.dailyCount-dw.length,dw);
  var qp=[];
  if(S.phrasesPerDay>0){
    var dp=dueList(P).slice(0,Math.max(1,Math.floor(S.phrasesPerDay*0.4)));
    var np=pickFrom(P,S.phrasesPerDay-dp.length,dp);
    qp=dp.concat(np);
  }
  return shuffle(nw.concat(dw,qp));
}
function ensureDay(){
  var t=dayKey();
  if(S.day!==t){
    S.day=t;S.goalShown=false;S.mode='new';S.undo=[];S.rq=[];
    S.queue=buildQueue();S.selected=S.queue.slice();rec();tok++;save();
  }else if(!S.queue.length&&S.mode==='new'&&!(S.hist[t]&&S.hist[t].s.length+S.hist[t].ps.length)){
    S.queue=buildQueue();S.selected=S.queue.slice();tok++;save();
  }
}
function curQ(){return S.mode==='review'?S.rq:S.queue}
function countStatus(list,st){var n=0;list.forEach(function(w){if(S.status[w.id]===st)n++});return n}

/* ---------- speech ---------- */
var defVoice=null;
function allVoices(){try{return 'speechSynthesis' in window?(speechSynthesis.getVoices()||[]):[]}catch(e){return []}}
function enVoices(){return allVoices().filter(function(v){return /^en([-_]|$)/i.test(v.lang)})}
var PREF=['Daniel','Kate','Serena','Oliver','Arthur','Martha','Stephanie','Libby','Sonia','Ryan','Samantha','Karen','Moira','Tessa','Rishi'];
function vscore(v){
  var s=/en[-_]GB/i.test(v.lang)?0:(/en[-_](AU|IE|ZA|IN)/i.test(v.lang)?200:400);
  var pi=PREF.length;PREF.forEach(function(p,i){if(v.name.indexOf(p)>-1&&i<pi)pi=i});
  return s+pi;
}
function topVoices(){
  var vs=enVoices().slice().sort(function(a,b){return vscore(a)-vscore(b)});
  var out=[],seen={};
  vs.forEach(function(v){var key=v.name.replace(/\s*\(.*?\)\s*/g,'').toLowerCase();if(!seen[key]&&out.length<4){seen[key]=1;out.push(v)}});
  return out;
}
function chosenVoice(){
  var vs=allVoices();
  if(S&&S.voice){for(var i=0;i<vs.length;i++)if(vs[i].voiceURI===S.voice)return vs[i]}
  var t=topVoices();return t[0]||null;
}
if('speechSynthesis' in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){if(currentTab==='menu')renderMenu()}}catch(e){}}
var SAY={'CD':'C D','DVD':'D V D','TV':'T V','OK':'okay','a, an':'a'};
function speak(text,btn,voice){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast('Озвучка недоступна в этом браузере');return}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(SAY[text]||text);
    var v=voice||chosenVoice();
    u.lang=v?v.lang:'en-GB';if(v)u.voice=v;u.rate=0.9;
    if(btn){btn.classList.add('on');u.onend=u.onerror=function(){btn.classList.remove('on')};setTimeout(function(){btn.classList.remove('on')},5000)}
    speechSynthesis.speak(u);
  }catch(e){toast('Не удалось воспроизвести звук')}
}

/* ---------- helpers ---------- */
var toastT=null;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2300)}
var POS={'indefinite article':'артикль','definite article':'артикль','infinitive marker':'частица','auxiliary v.':'вспом. гл.','modal v.':'мод. глагол','number':'числит.','noun.':'сущ.','n.':'сущ.','v.':'глагол','adj.':'прил.','adv.':'нареч.','prep.':'предлог','conj.':'союз','pron.':'местоим.','det.':'опред.','exclam.':'межд.'};
function posRu(p){return String(p||'').replace(/(indefinite article|definite article|infinitive marker|auxiliary v\.|modal v\.|number|noun\.|n\.|v\.|adj\.|adv\.|prep\.|conj\.|pron\.|det\.|exclam\.)/g,function(m){return POS[m]||m})}
function boldWord(sentence,word){
  var base=String(word).split(',')[0].trim();var cands=[];
  if(base.length<=3)cands.push('\\b('+reEsc(base)+'s?)\\b');
  else{cands.push('\\b('+reEsc(base)+'\\w*)');cands.push('\\b('+reEsc(base.slice(0,-1))+'\\w*)')}
  var out=esc(sentence);
  for(var i=0;i<cands.length;i++){var re=new RegExp(cands[i],'i');if(re.test(out))return out.replace(re,'<b>$1</b>')}
  return out;
}
function plural(n,a,b,c){var m=n%100,d=n%10;if(m>10&&m<20)return c;if(d===1)return a;if(d>=2&&d<=4)return b;return c}
var PLAY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M7 4.5v15l12-7.5z"/></svg>';
var CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function ipaTxt(s){return s?'/'+s.replace(/^\/|\/$/g,'')+'/':''}

/* ---------- learn page ---------- */
var tok=0,shownTok=-1,dir=0,revealed=false,lock=false,currentTab='learn';
function renderStats(){
  var q=curQ(),n=todayN(),r=rec();
  if(S.mode==='review'){
    $('#title').textContent='Повторение';
    $('#stats').textContent='Повторено '+(r.r.length+r.pr.length)+' · осталось '+q.length;
    $('#dashes').innerHTML='';$('#dashes').className='dashes';
  }else{
    $('#title').textContent='Oxford 3000';
    $('#stats').textContent='Выучено '+n+'/'+S.goal+' · в очереди '+q.length;
    var h='';for(var i=0;i<S.goal;i++)h+='<i class="'+(i<n?'on':'')+'"></i>';
    $('#dashes').innerHTML=h;$('#dashes').className='dashes'+(n>=S.goal?' full':'');
  }
  $('#btnUndo').disabled=!S.undo.length;
  $('#warn').hidden=storageOK;
}
function zoneLabels(it,st){
  var o=it.t==='e'?'фразу':'слово';
  if(st==='l')return ['Помню<br>'+(it.t==='e'?'эту фразу':'это слово'),'Забыл(а)<br>'+(it.t==='e'?'эту фразу':'это слово')];
  if(st==='p')return ['Выучил(а)<br>'+(it.t==='e'?'эту фразу':'это слово'),'Ещё<br>повторить'];
  if(it.t==='e')return ['Я знаю<br>эту фразу','Начать учить<br>эту фразу'];
  return ['Я уже знаю<br>это слово','Начать учить<br>это слово'];
}
function renderCard(){
  var q=curQ();
  if(!q.length){showDone();return}
  $('#done').hidden=true;$('#card').hidden=false;

/* ---------- actions ---------- */
function act(kind){
  var q=curQ();if(!q.length)return;
  var id=q[0],it=byId[id],isP=it.t==='e',st=S.status[id],t=dayKey(),r=rec(t);
  var snap={mode:S.mode,id:id,day:t,prev:st===undefined?null:st,kn:S.known[id]?1:0,sr:S.srs[id]?{st:S.srs[id].st,due:S.srs[id].due}:null,ms:S.mastered[id]||null,q:q.slice(),rec:JSON.stringify(r),gs:S.goalShown,tot:S.total};
  S.undo.push(snap);if(S.undo.length>20)S.undo.shift();
  q.shift();
  var sSet=isP?r.ps:r.s,rSet=isP?r.pr:r.r,lSet=isP?r.pl:r.n,requeue=false;
  add(sSet,id);
  if(kind==='know'){
    if(st===undefined){
      S.status[id]='l';
      if(isP){add(r.pl,id);setSrs(id,0)}else{S.known[id]=1;add(r.k,id);setSrs(id,1)}
    }else if(st==='p'){
      S.status[id]='l';delete S.known[id];add(rSet,id);add(lSet,id);setSrs(id,0);
    }else{
      add(rSet,id);var ns=Math.min((S.srs[id]?S.srs[id].st:0)+1,INTV.length-1);setSrs(id,ns);
      if(!isP&&ns>=3&&!S.mastered[id]){S.mastered[id]=t;add(r.m,id)}
    }
  }else{
    if(st==='l'){add(rSet,id);delete S.srs[id];delete S.known[id];S.status[id]='p'}
    else if(st==='p'){add(rSet,id)}
    else{S.status[id]='p'}
    requeue=(S.mode==='new');
  }
  if(requeue){var idx=Math.min(q.length,4+Math.floor(Math.random()*3));q.splice(idx,0,id)}
  r.c=(r.c||0)+1;S.total=(S.total||0)+1;S.lastStudy=new Date().toISOString();
  var reached=false;
  if(S.mode==='new'&&!S.goalShown&&r.n.length>=S.goal){S.goalShown=true;reached=true}
  if(S.mode==='new'&&!S.queue.length&&r.n.length<S.goal){
    var more=pickFrom(W,S.dailyCount,S.queue);
    if(more.length){S.queue=S.queue.concat(more);S.selected=S.selected.concat(more);toast('Цель дня ещё не набрана: добавил новые слова')}
  }
  tok++;save();render();
  if(reached)openGoal();
}
function undo(){
  if(!S.undo.length)return;
  var s=S.undo.pop();
  if(s.mode!==S.mode){S.undo=[];return}
  var id=s.id;
  if(s.prev===null)delete S.status[id];else S.status[id]=s.prev;
  if(s.kn)S.known[id]=1;else delete S.known[id];
  if(s.sr)S.srs[id]=s.sr;else delete S.srs[id];
  if(s.ms)S.mastered[id]=s.ms;else delete S.mastered[id];
  if(S.mode==='review')S.rq=s.q;else S.queue=s.q;
  S.hist[s.day]=JSON.parse(s.rec);S.goalShown=s.gs;S.total=s.tot;
  tok++;save();render();toast('Действие отменено');
}

function reviewPool(){

var statPeriod=7;

var MONC=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
function lastDays(n){var out=[],d=new Date();d.setHours(12,0,0,0);for(var i=n-1;i>=0;i--){var x=new Date(d);x.setDate(d.getDate()-i);out.push(dayKey(x))}return out}
function fmtDay(k){var p=k.split('-');return +p[2]+' '+MONC[+p[1]-1]}
function uni(days,f){var s={};days.forEach(function(k){var r=S.hist[k];if(r&&r[f])r[f].forEach(function(id){s[id]=1})});return Object.keys(s).length}
function goalMet(k){var r=S.hist[k];return !!r&&r.n.length>=(r.g||S.goal)}
function streaks(){
  var t=dayKey(),cur=0,k=goalMet(t)?t:addDays(t,-1);
  while(goalMet(k)){cur++;k=addDays(k,-1)}
  var keys=Object.keys(S.hist).filter(goalMet).sort(),best=0,run=0,prev=null;
  keys.forEach(function(d){run=(prev&&addDays(prev,1)===d)?run+1:1;if(run>best)best=run;prev=d});
  return {cur:cur,best:Math.max(best,cur)};
}
function weekHtml(){
  var d=new Date();d.setHours(12,0,0,0);var wd=(d.getDay()+6)%7,mon=new Date(d);mon.setDate(d.getDate()-wd);
  var names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],t=dayKey(),h='<div class="week"><div class="wline"></div>';
  for(var i=0;i<7;i++){
    var x=new Date(mon);x.setDate(mon.getDate()+i);var k=dayKey(x),r=S.hist[k];
    var c=k===t?'t':(goalMet(k)?'g':(r&&(r.s.length+r.ps.length)?'s':''));
    h+='<div class="wd '+c+'">'+names[i]+'</div>';
  }
  return h+'</div>';
}
function ringSvg(n,goal){
  var segs=Math.min(goal,24),cx=38,cy=38,R=30,gap=0.16,h='';
  var filled=goal>24?Math.round(Math.min(n,goal)/goal*segs):Math.min(n,segs);
  for(var i=0;i<segs;i++){
    var a0=-Math.PI/2+i*2*Math.PI/segs+gap/2,a1=-Math.PI/2+(i+1)*2*Math.PI/segs-gap/2;
    var x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    h+='<path d="M'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+R+' '+R+' 0 0 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'" fill="none" stroke="'+(i<filled?(n>=goal?'var(--green)':'var(--accent)'):'var(--line)')+'" stroke-width="6" stroke-linecap="round"/>';
  }
  return '<svg viewBox="0 0 76 76">'+h+'</svg>';
}
function niceStep(max){var c=[1,2,5,10,20,25,50,100,200,250,500,1000,2000];for(var i=0;i<c.length;i++)if(max/c[i]<=5)return c[i];return 5000}
function buildBars(p){
  var bars=[],days;
  if(p==='all'){
    var keys=Object.keys(S.hist).sort();
    var now=new Date(),endM=now.getFullYear()*12+now.getMonth();
    var startM=keys.length?(+keys[0].slice(0,4))*12+(+keys[0].slice(5,7)-1):endM;
    startM=Math.min(startM,endM-5);
    for(var m=startM;m<=endM;m++){
      var y=Math.floor(m/12),mo=m%12,pre=y+'-'+String(mo+1).padStart(2,'0'),ds=keys.filter(function(k){return k.indexOf(pre)===0});
      bars.push({label:MONC[mo]+(mo===0?' '+y:''),k:uni(ds,'k'),n:uni(ds,'n'),r:uni(ds,'r'),m:uni(ds,'m'),mon:false});
    }
    return bars;
  }
  days=lastDays(p);
  days.forEach(function(k){var r=S.hist[k]||{};var d=new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10),12);
    bars.push({label:fmtDay(k),k:(r.k||[]).length,n:(r.n||[]).length,r:(r.r||[]).length,m:(r.m||[]).length,mon:d.getDay()===1})});
  return bars;
}
function chartSvg(bars,p,w){
  var H=290,L=36,B=26,T=12,R=6,inner=w-L-R,max=1;
  bars.forEach(function(b){max=Math.max(max,b.k+b.n+b.r+b.m)});
  var step=niceStep(max),top=Math.ceil(max/step)*step;
  function Y(v){return T+(H-T-B)*(1-v/top)}
  var slot=inner/bars.length,bw=Math.min(40,slot*0.7),g='';
  for(var v=0;v<=top;v+=step){g+='<line x1="'+L+'" x2="'+(w-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="12" fill="var(--mute)">'+v+'</text>'}
  var every=p===7?1:(p===30?5:(p===90?14:1));
  bars.forEach(function(b,i){
    var cx=L+(i+0.5)*slot,x=cx-bw/2,acc=0;
    if(p!=='all'&&(p===7||b.mon))g+='<line x1="'+cx+'" x2="'+cx+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--mute)" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>';
    [['k','var(--gray)'],['n','var(--pink)'],['r','var(--orange)'],['m','var(--green)']].forEach(function(s){
      var val=b[s[0]];if(!val)return;
      var y1=Y(acc),y2=Y(acc+val),hh=Math.max(1,y1-y2);
      g+='<rect x="'+x.toFixed(1)+'" y="'+y2.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="'+Math.min(5,bw/4).toFixed(1)+'" fill="'+s[1]+'"/>';
      if(hh>=15&&bw>=20)g+='<text x="'+cx.toFixed(1)+'" y="'+(y2+hh/2+4).toFixed(1)+'" text-anchor="middle" font-size="12" fill="#fff">'+val+'</text>';
      acc+=val;
    });
    if(i%every===0||(p==='all'&&i%2===0&&bars.length>6))g+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="var(--ink)">'+b.label+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+H+'" role="img" aria-label="График">'+g+'</svg>';
}
function renderStatsPage(){
  var el=$('#pgStats'),t=dayKey(),r=rec(),st=streaks(),n=r.n.length;
  var allDays=Object.keys(S.hist),per=statPeriod==='all'?allDays:lastDays(statPeriod);
  var pl=statPeriod==='all'?'Всё время':(statPeriod+' дней');
  var w=Math.max(300,Math.min(500,(el.clientWidth||360)-60));
  var learnedWords=countStatus(W,'l'),learning=countStatus(W,'p'),mastered=Object.keys(S.mastered).length;

    '<div class="two"><div class="mini"><div class="a">Вы учите слова</div><div class="b"><b>'+st.cur+'</b> '+plural(st.cur,'день','дня','дней')+' подряд</div></div><div class="mini"><div class="a">Рекорд</div><div class="b"><b>'+st.best+'</b> '+plural(st.best,'день','дня','дней')+' подряд</div></div></div>'+
    '<div class="ring">'+ringSvg(n,S.goal)+'<div><div class="t1">Выучено сегодня</div><div class="t2">'+n+'<small>/'+S.goal+'</small> <button class="ed" data-st="goal" aria-label="Изменить цель"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.500 3.500a2.100 2.100 0 013 3L7 19l-4 1 1-4z"/></svg></button></div></div></div></div>';
  h+='<div class="panelc"><h3>Сегодня</h3>'+
    '<div class="trow"><span>Слов изучено (просмотрено)</span><b>'+r.s.length+'</b></div>'+
    '<div class="trow"><span>Слов повторено</span><b>'+r.r.length+'</b></div>'+
    '<div class="trow"><span>Выучено новых слов</span><b>'+r.n.length+'</b></div>'+
    '<div class="trow"><span>Уже известных слов</span><b>'+r.k.length+'</b></div>'+
    '<div class="trow"><span>Фраз изучено / выучено</span><b>'+r.ps.length+' / '+r.pl.length+'</b></div>'+
    '<div class="trow"><span>Ответов за день</span><b>'+(r.c||0)+'</b></div></div>';
  var lab={7:'7 дней',30:'30 дней',90:'90 дней','all':'Всё время'};
  h+='<div class="panelc"><div class="seg4">'+[7,30,90,'all'].map(function(p){return '<button data-st="p'+p+'" class="'+(statPeriod===p?'on':'')+'">'+lab[p]+'</button>'}).join('')+'</div>'+
    '<div class="chartbox">'+chartSvg(buildBars(statPeriod),statPeriod,w)+'</div>'+
    '<div class="cur">Изучается сейчас: '+learning+' '+plural(learning,'новое слово','новых слова','новых слов')+'</div>'+
    '<div class="legend"><div class="lrow h"><span class="n">Всего</span><span class="n">'+(statPeriod==='all'?'Всё время':pl)+'</span><span></span><span></span></div>'+
    [['n','Выучено новых слов','var(--pink)'],['r','Повторено (уникальных)','var(--orange)'],['m','Полностью выучено','var(--green)'],['k','Уже известные','var(--gray)']].map(function(x){
      return '<div class="lrow"><span class="n">'+uni(allDays,x[0])+'</span><span class="n">'+uni(per,x[0])+'</span><i style="background:'+x[2]+'"></i><span>'+x[1]+'</span></div>';
    }).join('')+'</div>';
  if(statPeriod!=='all'){
    var act=per.filter(function(k){var x=S.hist[k];return x&&(x.c||0)>0}).length,gm=per.filter(goalMet).length;
    h+='<div class="note">Дней с занятиями: '+act+' из '+per.length+' · цель выполнена: '+gm+' '+plural(gm,'день','дня','дней')+'</div>';
  }
  h+='<div class="note">Столбики показывают разные категории: слово может попасть и в «выучено», и в «повторено». «Полностью выучено» — слово успешно повторено 3 раза подряд по расписанию (через 1, 3 и 7 дней).</div></div>';
  var pS=uni(per,'ps'),pL=uni(per,'pl'),pR=uni(per,'pr');
  h+='<div class="panelc"><h3>Фразы</h3>'+
    '<div class="trow"><span>Изучено фраз (уникальных)</span><b>'+uni(allDays,'ps')+' · '+pl+': '+pS+'</b></div>'+
    '<div class="trow"><span>Выучено фраз</span><b>'+uni(allDays,'pl')+' · '+pl+': '+pL+'</b></div>'+
    '<div class="trow"><span>Повторено фраз</span><b>'+uni(allDays,'pr')+' · '+pl+': '+pR+'</b></div>'+
    '<div class="trow"><span>Фраз выучено сейчас</span><b>'+countStatus(P,'l')+' из '+P.length+'</b></div></div>';
  var pct=W.length?Math.round(learnedWords/W.length*1000)/10:0;
  h+='<div class="panelc"><h3>Oxford 3000</h3><div class="trow"><span>Выучено или известно</span><b>'+learnedWords+' из '+W.length+' ('+pct+'%)</b></div><div class="pbar"><i style="width:'+Math.min(100,pct)+'%"></i></div>'+
    '<div class="trow"><span>Полностью выучено</span><b>'+mastered+'</b></div>'+
    '<div class="trow"><span>Дней с занятиями за всё время</span><b>'+allDays.filter(function(k){return (S.hist[k].c||0)>0}).length+'</b></div>'+
    '<div class="trow"><span>Всего ответов</span><b>'+(S.total||0)+'</b></div>'+
    '<div class="trow"><span>Последнее занятие</span><b>'+(S.lastStudy?fmtDay(dayKey(new Date(S.lastStudy))):'—')+'</b></div></div>';
  el.innerHTML=h;
}
$('#pgStats').addEventListener('click',function(e){
  var b=e.target.closest('[data-st]');if(!b)return;var a=b.getAttribute('data-st');
  if(a==='goal'){openGoalEdit();return}
  if(a.charAt(0)==='p'){var v=a.slice(1);statPeriod=v==='all'?'all':+v;renderStatsPage()}
});

/* ---------- menu page ---------- */
function renderMenu(){
  var el=$('#pgMenu'),tv=topVoices(),cv=chosenVoice(),all=enVoices();
  var h='<div class="bar"><h1>Меню</h1></div>';
  h+='<div class="panelc" style="margin-top:4px"><h3>Голос озвучки</h3>';
  if(!tv.length){
    h+='<div class="note">Английские голоса ещё не загрузились или недоступны на этом устройстве. Нажми «Обновить список». Если голосов нет, звук работать не будет.</div><button class="btn" data-m="vrefresh">Обновить список</button>';
  }else{
    h+='<div class="note">Выбери голос и нажми ▶, чтобы послушать. Выбор сохраняется и для слов, и для фраз.</div>';
    tv.forEach(function(v,i){
      h+='<div class="vrow"><div class="vn"><b>'+esc(v.name)+'</b><span>'+esc(v.lang)+(v.localService===false?' · сетевой':'')+'</span></div><button class="vp" data-m="vplay" data-i="'+i+'" aria-label="Прослушать">'+PLAY+'</button><button class="vs'+(cv&&cv.voiceURI===v.voiceURI?' on':'')+'" data-m="vpick" data-i="'+i+'">'+(cv&&cv.voiceURI===v.voiceURI?'Выбран':'Выбрать')+'</button></div>';
    });
    if(tv.length<4)h+='<div class="note">На устройстве найдено разных английских голосов: '+tv.length+'. Чтобы добавить, открой Настройки iPhone → Универсальный доступ → Устный контент → Голоса → English и скачай другие.</div>';
    if(all.length>tv.length){
      h+='<select id="vsel"><option value="">Все английские голоса ('+all.length+')…</option>'+all.map(function(v,i){return '<option value="'+esc(v.voiceURI)+'">'+esc(v.name)+' — '+esc(v.lang)+'</option>'}).join('')+'</select>';
    }
    if(cv&&tv.every(function(v){return v.voiceURI!==cv.voiceURI}))h+='<div class="note">Сейчас выбран: '+esc(cv.name)+' ('+esc(cv.lang)+').</div>';
    h+='<button class="btn" data-m="vrefresh">Обновить список голосов</button>';
  }
  h+='</div>';
  h+='<div class="panelc"><h3>Режим</h3><div class="seg"><button data-m="mnew" class="'+(S.mode==='new'?'on':'')+'">Новые слова</button><button data-m="mrev" class="'+(S.mode==='review'?'on':'')+'">Повторение</button></div>'+
    '<div class="mrow" style="margin-top:8px"><span>Слов в подборке на день</span><div class="step"><button data-m="wm">−</button><b>'+S.dailyCount+'</b><button data-m="wp">+</button></div></div>'+
    '<div class="mrow"><span>Фраз в подборке на день</span><div class="step"><button data-m="pm">−</button><b>'+S.phrasesPerDay+'</b><button data-m="pp">+</button></div></div>'+
    '<div class="note">Подборка меняется со следующего дня. Слов от 20 до 35, фраз от 0 до 20.</div></div>';
  h+='<div class="panelc"><h3>Данные</h3><button class="btn" data-m="backup">Резервная копия прогресса</button><button class="btn" data-m="words">Заменить список слов</button><button class="btn" data-m="report">О данных (проверка списков)</button><button class="btn dng" data-m="reset">Сбросить прогресс</button></div>';
  el.innerHTML=h;
}
$('#pgMenu').addEventListener('change',function(e){
  if(e.target.id==='vsel'&&e.target.value){S.voice=e.target.value;save();renderMenu();speak('Hello! How are you today?',null)}
});
$('#pgMenu').addEventListener('click',function(e){
  var b=e.target.closest('[data-m]');if(!b)return;var a=b.getAttribute('data-m'),tv=topVoices();
  if(a==='vplay'){speak('Hello! How are you today? This is how I sound.',b,tv[+b.getAttribute('data-i')])}
  else if(a==='vpick'){var v=tv[+b.getAttribute('data-i')];if(v){S.voice=v.voiceURI;save();renderMenu();speak('Hello! I will read your words.',null,v)}}
  else if(a==='vrefresh'){try{speechSynthesis.getVoices()}catch(_){}setTimeout(renderMenu,400);toast('Список обновлён')}
  else if(a==='mnew')setMode('new');
  else if(a==='mrev')setMode('review');
  else if(a==='wm'||a==='wp'){S.dailyCount=Math.max(20,Math.min(35,S.dailyCount+(a==='wp'?1:-1)));save();renderMenu()}
  else if(a==='pm'||a==='pp'){S.phrasesPerDay=Math.max(0,Math.min(20,S.phrasesPerDay+(a==='pp'?1:-1)));save();renderMenu()}
  else if(a==='backup')openBackup();
  else if(a==='words')openWords();
  else if(a==='report')openReport();
  else if(a==='reset'){openSheet('<h3>Сбросить прогресс?</h3><p class="sub">Будут удалены выученные слова, фразы и вся статистика. Это нельзя отменить. Сначала можно сделать резервную копию.</p><button class="btn dng" data-s="reset">Сбросить</button><button class="btn" data-s="close">Отмена</button>',true)}
});
