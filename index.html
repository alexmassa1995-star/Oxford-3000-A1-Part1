<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Oxford 3000 · A1</title>
<style>
:root{
  --bg:#eeeef4;--card:#ffffff;--ink:#4a4a5c;--mute:#b3b3c6;--line:#ececf3;--soft:#f6f6fa;
  --accent:#6c7fe6;--green:#6dbf82;--red:#e0605a;--sheet:#ffffff;--shade:rgba(40,40,70,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#14141b;--card:#1f1f2a;--ink:#e8e8f2;--mute:#6f6f86;--line:#2c2c3a;--soft:#2a2a37;--accent:#8c9cff;--sheet:#242432;--shade:rgba(0,0,0,.55)}
}
:root[data-theme="dark"]{--bg:#14141b;--card:#1f1f2a;--ink:#e8e8f2;--mute:#6f6f86;--line:#2c2c3a;--soft:#2a2a37;--accent:#8c9cff;--sheet:#242432;--shade:rgba(0,0,0,.55)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:6px 14px 12px}
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:48px}
.bar h1{margin:0;font-size:17px;font-weight:500;text-align:center}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.iconbtn svg{width:26px;height:26px}
.iconbtn:disabled{color:var(--mute);opacity:.6}
.statrow{display:flex;align-items:center;justify-content:space-between;min-height:34px;padding-left:8px}
.statrow span{font-size:15px;color:var(--mute)}
.dashes{display:flex;gap:5px;padding:2px 8px 0}
.dashes i{flex:1;height:4px;border-radius:2px;background:rgba(130,130,170,.28)}
.dashes i.on{background:var(--accent)}
.dashes.full i.on{background:var(--green)}
#stage{flex:1;position:relative;min-height:0;margin-top:12px}
#card,#done{position:absolute;inset:0;background:var(--card);border-radius:24px;display:flex;flex-direction:column;overflow:hidden}
#card{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transform-origin:50% 85%;will-change:transform}
.ctop{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0 22px}
.tag{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:500}
.tag i{width:22px;height:22px;border-radius:6px;background:var(--soft);display:block}
.tag i.on{background:var(--accent)}
.dots{width:36px;height:36px;border:2px solid var(--accent);border-radius:50%;color:var(--accent);display:flex;align-items:center;justify-content:center}
.dots svg{width:18px;height:18px}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:20px 18px 14px 22px}
.cat{font-size:15px;color:var(--mute);margin-bottom:2px}
.word{font-size:34px;line-height:1.1;font-weight:500;letter-spacing:-.4px;overflow-wrap:anywhere}
.ipa{font-size:19px;color:var(--ink);opacity:.85;margin-top:6px}
.play{flex:none;width:62px;height:62px;border:2px solid var(--accent);border-radius:17px;color:var(--accent);display:flex;align-items:center;justify-content:center;margin-top:6px}
.play svg{width:22px;height:22px}
.play.on{background:var(--accent);color:var(--card)}
.cbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#front{display:flex;justify-content:center;padding-top:44px}
.eye{width:150px;height:150px;border-radius:20px;background:var(--soft);color:var(--mute);display:flex;align-items:center;justify-content:center}
.eye svg{width:34px;height:34px}
#back{border-top:1px solid var(--line);position:relative;margin:0 0 0 22px;padding-right:0}
#back:before{content:"";position:absolute;top:-9px;left:calc(50% - 22px);width:16px;height:16px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.ru{font-size:30px;line-height:1.2;font-weight:500;padding:30px 18px 26px 0}
.ex{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:14px 0 14px 0;font-size:18px;line-height:1.3}
.ex:last-child{border-bottom:1px solid var(--line)}
.ex .chev{flex:none;width:16px;color:var(--ink)}
.ex .t{flex:1}
.ex .t b{font-weight:700}
.ex .tr{display:block;color:var(--mute);font-size:15px;margin-top:4px}
.ex .xp{flex:none;width:44px;height:44px;color:var(--accent);display:flex;align-items:center;justify-content:center}
.ex .xp svg{width:18px;height:18px}
.zones{display:grid;grid-template-columns:1fr 14px 1fr;gap:6px;align-items:center;padding:10px 12px 14px}
.zone{height:68px;border-radius:15px;font-size:16px;font-weight:500;line-height:1.25;text-align:center;transition:background .12s,color .12s}
.sep{height:34px;display:flex;gap:2px;justify-content:center}
.sep i{width:1px;background:var(--line)}
#done{align-items:center;justify-content:center;text-align:center;padding:28px}
#done h2{font-size:26px;margin:0 0 10px;font-weight:600}
#done p{margin:0 0 22px;font-size:17px;line-height:1.4;color:var(--mute)}
.big{display:block;width:100%;max-width:320px;height:54px;border-radius:15px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;margin:0 auto 10px}
.big.alt{background:var(--soft);color:var(--ink);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(30,30,45,.92);color:#fff;padding:11px 16px;border-radius:12px;font-size:15px;max-width:86vw;text-align:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#warn{background:#fff3cd;color:#6b5400;font-size:13px;text-align:center;padding:6px 10px;border-radius:10px;margin-bottom:6px}
#veil{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--sheet);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.panel.mid{border-radius:24px;margin:auto 14px;align-self:center;max-height:80%}
.panel h3{margin:0 0 4px;font-size:20px;font-weight:600}
.panel .sub{font-size:14px;color:var(--mute);margin:0 0 14px;line-height:1.35}
.panel h4{margin:18px 0 8px;font-size:15px;font-weight:600;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button,.btn{height:46px;border-radius:12px;background:var(--soft);font-weight:500;font-size:15px}
.seg button.on{background:var(--accent);color:#fff}
.btn{width:100%;margin-top:8px}
.btn.pri{background:var(--accent);color:#fff}
.btn.dng{color:var(--red)}
.step{display:flex;align-items:center;gap:14px}
.step button{width:40px;height:40px;border-radius:12px;background:var(--soft);font-size:22px;line-height:1}
.step b{min-width:28px;text-align:center;font-size:18px}
textarea{width:100%;height:150px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:10px;font:13px/1.35 ui-monospace,Menlo,monospace;resize:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>

  if(!S.history||typeof S.history!=='object')S.history={};
  if(!S.srs||typeof S.srs!=='object')S.srs={};
}
function loadState(){
  var s=null; try{s=JSON.parse(lsGet(KEY)||'null')}catch(e){}
  S=Object.assign(defaults(),s||{}); sanitize();
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(n,exclude){
  var ex={};(exclude||[]).forEach(function(i){ex[i]=1});
  var learning=[],fresh=[];
  W.forEach(function(w){if(ex[w.id])return;var st=S.status[w.id];if(st==='l')return;(st==='p'?learning:fresh).push(w.id)});
  learning=shuffle(learning);fresh=shuffle(fresh);
  var take=learning.slice(0,Math.floor(n/3));
  var rest=learning.slice(take.length);
  var out=take.concat(fresh.slice(0,n-take.length));
  if(out.length<n) out=out.concat(rest.slice(0,n-out.length));
  return shuffle(out);
}
var INTV=[1,3,7,14,30,60];
function addDays(k,n){var p=k.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function setSrs(id,st){st=Math.max(0,Math.min(INTV.length-1,st));S.srs[id]={st:st,due:addDays(dayKey(),INTV[st])}}
function migrateSrs(){W.forEach(function(w){if(S.status[w.id]==='l'&&!S.srs[w.id])setSrs(w.id,0)})}
function dueIds(){
  var t=dayKey();
  return W.filter(function(w){return S.status[w.id]==='l'&&S.srs[w.id]&&S.srs[w.id].due<=t})
    .sort(function(a,b){return S.srs[a.id].due<S.srs[b.id].due?-1:1}).map(function(w){return w.id});
}
function buildQueue(){
  migrateSrs();
  var rev=dueIds().slice(0,Math.floor(S.dailyCount*0.3));
  var nw=pick(S.dailyCount-rev.length,rev);
  return shuffle(nw.concat(rev));
}
function ensureDay(){
  var t=dayKey();
  if(S.day!==t){
    S.day=t;S.learnedToday=[];S.reviewedToday=0;S.goalShown=false;S.mode='new';S.undo=[];S.rq=[];
    S.queue=buildQueue();S.selected=S.queue.slice();
    save();
  } else if(!S.queue.length && !S.learnedToday.length && S.mode==='new'){
    S.queue=buildQueue();S.selected=S.queue.slice();save();
  }
}
function curQ(){return S.mode==='review'?S.rq:S.queue}
function learnedTotal(){var n=0;W.forEach(function(w){if(S.status[w.id]==='l')n++});return n}
function practiceTotal(){var n=0;W.forEach(function(w){if(S.status[w.id]==='p')n++});return n}

/* ---------- speech ---------- */
var voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  var vs=speechSynthesis.getVoices()||[];
  var gb=vs.filter(function(v){return /en[-_]GB/i.test(v.lang)});
  var pref=['Daniel','Kate','Serena','Oliver','Arthur','Martha'];
  voice=gb.filter(function(v){return pref.some(function(p){return v.name.indexOf(p)>-1})})[0]||gb[0]||vs.filter(function(v){return /^en/i.test(v.lang)})[0]||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
var SAY={'CD':'C D','DVD':'D V D','TV':'T V','OK':'okay','a, an':'a','T-shirt':'T shirt','I':'I'};
var playTimer=null;
function speak(text,btn){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast('Озвучка недоступна в этом браузере');return}
  try{
    speechSynthesis.cancel();
    if(!voice)pickVoice();
    var u=new SpeechSynthesisUtterance(SAY[text]||text);
    u.lang='en-GB'; if(voice)u.voice=voice; u.rate=0.9;
    if(btn){btn.classList.add('on');u.onend=u.onerror=function(){btn.classList.remove('on')};setTimeout(function(){btn.classList.remove('on')},4000)}
    speechSynthesis.speak(u);
  }catch(e){toast('Не удалось воспроизвести звук')}
}

var toastT=null;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2200)}
var POS={'indefinite article':'артикль','definite article':'артикль','infinitive marker':'частица','auxiliary v.':'вспом. глагол','modal v.':'модальный глагол','number':'числит.','noun.':'сущ.','n.':'сущ.','v.':'глагол','adj.':'прил.','adv.':'нареч.','prep.':'предлог','conj.':'союз','pron.':'местоим.','det.':'опред.','exclam.':'межд.'};
function posRu(p){return String(p||'').replace(/(indefinite article|definite article|infinitive marker|auxiliary v\.|modal v\.|number|noun\.|n\.|v\.|adj\.|adv\.|prep\.|conj\.|pron\.|det\.|exclam\.)/g,function(m){return POS[m]||m})}
function boldWord(sentence,word){
  var base=String(word).split(',')[0].trim();
  var cands=[];
  if(base.length<=3)cands.push('\\b('+reEsc(base)+'s?)\\b');
  else{cands.push('\\b('+reEsc(base)+'\\w*)');cands.push('\\b('+reEsc(base.slice(0,-1))+'\\w*)')}
  var out=esc(sentence);
  for(var i=0;i<cands.length;i++){
    var re=new RegExp(cands[i],'i');
    if(re.test(out)){return out.replace(re,'<b>$1</b>')}
  }
  return out;
}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

/* ---------- actions ---------- */
function act(kind){
  var q=curQ();if(!q.length)return;
  var id=q[0];
  var snap={mode:S.mode,id:id,prev:S.status[id]===undefined?null:S.status[id],sr:S.srs[id]?{st:S.srs[id].st,due:S.srs[id].due}:null,q:q.slice(),lt:S.learnedToday.slice(),rt:S.reviewedToday,gs:S.goalShown};
  S.undo.push(snap);if(S.undo.length>15)S.undo.shift();
  q.shift();
  var wasLearned=S.status[id]==='l';
  if(kind==='know'){
    if(wasLearned){setSrs(id,(S.srs[id]?S.srs[id].st:0)+1);S.reviewedToday++}
    else{
      S.status[id]='l';setSrs(id,0);
      if(S.mode==='new'){if(S.learnedToday.indexOf(id)<0)S.learnedToday.push(id)}
      else S.reviewedToday++;
    }
  }else{
    S.status[id]='p';delete S.srs[id];
    if(S.mode==='new'){var idx=Math.min(q.length,4+Math.floor(Math.random()*3));q.splice(idx,0,id)}
    else S.reviewedToday++;
  }
  S.lastStudy=new Date().toISOString();
  S.history[S.day]={learned:S.learnedToday.length,reviewed:S.reviewedToday};
  var reached=false;
  if(S.mode==='new'&&!S.goalShown&&S.learnedToday.length>=S.goal){S.goalShown=true;reached=true}
  save();render();
  if(reached)openGoal();
}
function undo(){
  if(!S.undo.length){return}
  var s=S.undo.pop();
  if(s.mode!==S.mode){S.undo=[];return}
  if(s.prev===null)delete S.status[s.id];else S.status[s.id]=s.prev;
  if(s.sr)S.srs[s.id]=s.sr;else delete S.srs[s.id];
  if(S.mode==='review')S.rq=s.q;else S.queue=s.q;
  S.learnedToday=s.lt;S.reviewedToday=s.rt;S.goalShown=s.gs;
  S.history[S.day]={learned:S.learnedToday.length,reviewed:S.reviewedToday};
  save();render();toast('Действие отменено');
}

function resetZones(){zK.style.background='';zK.style.color='';zL.style.background='';zL.style.color=''}

  card.style.transform='translateX('+dx+'px) rotate('+(dx/24)+'deg)';
  var p=Math.min(1,Math.abs(dx)/TH());
  if(dx<-16){zK.style.background='rgba(109,191,130,'+(0.45+0.55*p)+')';zK.style.color='#fff';zL.style.background='';zL.style.color=''}
  else if(dx>16){zL.style.background='rgba(224,96,90,'+(0.45+0.55*p)+')';zL.style.color='#fff';zK.style.background='';zK.style.color=''}
  else resetZones();
}
function fly(kind){
  if(lock)return;lock=true;
  var dir=kind==='know'?-1:1;
  if(kind==='know'){zK.style.background='var(--green)';zK.style.color='#fff'}else{zL.style.background='var(--red)';zL.style.color='#fff'}
  card.style.transition='transform .24s ease-in,opacity .24s ease-in';
  card.style.transform='translateX('+(dir*window.innerWidth*1.1)+'px) rotate('+(dir*16)+'deg)';
  card.style.opacity='0.2';
  setTimeout(function(){lock=false;act(kind)},230);
}
function snapBack(){card.style.transition='transform .22s ease-out';card.style.transform='none';resetZones()}
card.addEventListener('pointerdown',function(e){
  if(lock||e.target.closest('.play,.xp,.dots,.zone'))return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,moved:false,t:Date.now()};
});
card.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved){
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3){drag.moved=true;try{card.setPointerCapture(e.pointerId)}catch(_){}card.style.transition='none'}
    else if(Math.abs(dy)>12){drag=null;return}
    else return;
  }
  drag.dx=dx;paint(dx);
});
function endDrag(e,cancel){
  if(!drag||(e&&e.pointerId!==drag.id))return;
  var d=drag;drag=null;
  if(d.moved){

  }else if(!cancel&&Date.now()-d.t<500){reveal()}
}

function reviewPool(){

    var t=$('#bk');if(!t.value){var o2=Object.assign({},S,{undo:[]});t.value=JSON.stringify(o2)}
    t.focus();t.select();try{t.setSelectionRange(0,t.value.length)}catch(_){}
    var ok=false;try{ok=document.execCommand('copy')}catch(_){}
    if(!ok&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(function(){toast('Скопировано')},function(){toast('Выдели текст и скопируй вручную')})}
    else toast(ok?'Скопировано':'Выдели текст и скопируй вручную');
  }
  else if(a==='bkload'){
    try{
      var obj=JSON.parse($('#bk').value);
      if(!obj||typeof obj.status!=='object')throw new Error('bad');
      S=Object.assign(defaults(),obj,{undo:[]});sanitize();save();ensureDay();closeSheet();render();toast('Прогресс загружен');
    }catch(err){toast('Не получилось прочитать копию')}
  }
  else if(a==='words')openWords();
  else if(a==='wload'){
    try{
      var arr=JSON.parse($('#wj').value);if(!Array.isArray(arr)||!arr.length)throw new Error('bad');
      var okc=arr.filter(function(x){return x&&x.w&&x.ru}).length;if(!okc)throw new Error('bad');
      lsSet(WKEY,JSON.stringify(arr));loadWords();sanitize();S.queue=pick(S.dailyCount);S.selected=S.queue.slice();S.learnedToday=[];S.mode='new';S.undo=[];save();closeSheet();render();toast('Загружено слов: '+W.length);
    }catch(err){toast('Неверный формат JSON')}
  }
  else if(a==='wreset'){lsDel(WKEY);loadWords();sanitize();S.queue=pick(S.dailyCount);S.selected=S.queue.slice();S.mode='new';S.undo=[];save();closeSheet();render();toast('Встроенный список возвращён')}
  else if(a==='reset'){
    if(!resetArmed){resetArmed=true;b.textContent='Точно сбросить? Нажми ещё раз';return}
    lsDel(KEY);S=defaults();sanitize();ensureDay();closeSheet();render();toast('Прогресс сброшен');
  }
});

/* ---------- init ---------- */
loadWords();loadState();ensureDay();render();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){var t=dayKey();if(S.day!==t){ensureDay();render()}}else save()});
})();
</script>
</body>
</html>
