name: Generate audio
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test or all"
        default: "test"
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python gen_audio.py ${{ github.event.inputs.mode }}
      - name: Size report
        if: always()
        run: |
          find audio audio_test -name '*.tmp' -delete 2>/dev/null || true
          du -sh audio audio_test 2>/dev/null || true
          find audio audio_test -name '*.mp3' 2>/dev/null | wc -l
      - name: Commit audio
        if: always() && github.event.inputs.mode == 'all'
        run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add audio
          git commit -m "Add generated audio" || echo "nothing to commit"
          git push
      - name: Upload test files
        if: always() && github.event.inputs.mode == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: audio_test
          path: audio_test
